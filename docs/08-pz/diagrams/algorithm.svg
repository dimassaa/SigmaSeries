<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1320" viewBox="0 0 1250 1320"><rect width="1250" height="1320" fill="#ffffff"/><text x="30" y="40" font-family="DejaVu Sans" font-size="18" text-anchor="start" font-weight="bold">Алгоритм формирования рекомендаций</text><rect x="470" y="80" width="310" height="64" rx="8" fill="#f7f7f7" stroke="#333333" stroke-width="1.5"/><text x="625.0" y="96.5" font-family="DejaVu Sans" font-size="12" text-anchor="middle" font-weight="normal">История зрителя:</text><text x="625.0" y="115.5" font-family="DejaVu Sans" font-size="12" text-anchor="middle" font-weight="normal">оценки, отметки, любимые жанры</text><polyline points="625,144 625,190" fill="none" stroke="#111111" stroke-width="1.5"/><polygon points="625,190 630.0,179.0 620.0,179.0" fill="#111111"/><polygon points="625.0,190 780,245.0 625.0,300 470,245.0" fill="#f7f7f7" stroke="#333333" stroke-width="1.5"/><text x="625.0" y="231.0" font-family="DejaVu Sans" font-size="13" text-anchor="middle" font-weight="normal">История</text><text x="625.0" y="251.0" font-family="DejaVu Sans" font-size="13" text-anchor="middle" font-weight="normal">достаточна?</text><polyline points="625,300 625,350" fill="none" stroke="#111111" stroke-width="1.5"/><polygon points="625,350 630.0,339.0 620.0,339.0" fill="#111111"/><text x="635" y="330" font-family="DejaVu Sans" font-size="12" text-anchor="start" font-weight="normal">да</text><rect x="470" y="350" width="310" height="70" rx="8" fill="#f7f7f7" stroke="#333333" stroke-width="1.5"/><text x="625.0" y="369.5" font-family="DejaVu Sans" font-size="12" text-anchor="middle" font-weight="normal">Кандидаты по жанрам вкуса</text><polyline points="625,420 625,460" fill="none" stroke="#111111" stroke-width="1.5"/><polygon points="625,460 630.0,449.0 620.0,449.0" fill="#111111"/><rect x="470" y="460" width="310" height="70" rx="8" fill="#f7f7f7" stroke="#333333" stroke-width="1.5"/><text x="625.0" y="479.5" font-family="DejaVu Sans" font-size="1